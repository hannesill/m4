repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Retained provenance files are byte-exact copies with recorded hashes.
      - id: trailing-whitespace
        exclude: '^benchmark/release/v1/planning/claude28/provenance/'
      - id: end-of-file-fixer
        exclude: '^benchmark/release/v1/planning/claude28/provenance/'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: '\.(mp4|avi|mov|mkv)$|static/vendor/|benchmark/shared/ground_truth/|benchmark/release/v1/planning/'
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: derived-docs
        name: derived docs freshness
        entry: uv run python scripts/update_derived_docs.py --check
        language: system
        files: '^(docs/TOOLS\.md|scripts/update_derived_docs\.py|src/m4/core/derived/builtins/.*\.sql)$'
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python] # Run on changes to Python files
        pass_filenames: false # Pytest typically runs on the whole suite
        # stages: [commit] # This is the default, explicitly stating it
