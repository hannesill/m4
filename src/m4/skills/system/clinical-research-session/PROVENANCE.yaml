changelog:
  - version: "1.0"
    date: 2026-01-17
    summary: Initial creation with interview-driven research protocol, scientific integrity guardrails, and skill-matching guidance
  - version: "2.0"
    date: 2026-02-04
    summary: Standardized to 4-field frontmatter and reorganized into category subdirectories
  - version: "2.1"
    date: 2026-02-07
    summary: Integrate display into research phases — show protocol for review (Phase 2), save-then-show at each analysis step (Phase 3), section divider and summary card (After Analysis), and display annotations in common research patterns
  - version: "3.0"
    date: 2026-02-10
    summary: Move research interview from terminal conversation to vitrine form card. Add Terminal and Vitrine handoff section. Restructure Phase 1 as form + review guidance. Update example flow to show form-first pattern with terminal refinement.
  - version: "4.0"
    date: 2026-10-15
    summary: >-
      Rewrite for precision and length (2,321 to under 900 words). Steps with completion
      criteria; dataset choices come from `m4 list-datasets --json` and the agent never
      downloads or initialises data; analysis scripts run standalone and are shown through
      runpy, so matplotlib or Plotly figures both work; the example cohort runs on raw
      hosp/icu tables (no sepsis3 join on hadm_id, one stay per patient); blocking-call
      timeouts explained; question library and protocol template moved to references/;
      bias guidance deferred to clinical-research-pitfalls; Claude Code-specific wording and
      the nonexistent /research command removed. Checked against M4 0.5.6 and Vitrine 0.1.4.
